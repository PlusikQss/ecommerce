[project]
name = "ecommerce"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexandr Korolev",email = "plusikqss@ya.ru"}
]
requires-python = "^3.11"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "mypy (>=2.4.0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true